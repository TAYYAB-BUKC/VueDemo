<!Doctype="html">
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        {{ message }}
    </div>

    <div id="app-2">
        <span v-bind:title="message">
            Hover your mouse over me for a few seconds
            to see my dynamically bound title!
        </span>
    </div>


    <script>
        var app = new Vue({
            el: '#app',
            data: {
                message: 'Hello Vue!'
            }
        });

        function MyGreeting() {
            //document.getElementById("app").innerHTML = "Hello World From Vue 2.x!"
            app.message = "Hello World From Vue 2.x!";
        }

        document.addEventListener("DOMContentLoaded", function (e) {
            console.log("Example page has loaded!");
            //app.message = "Hello World From Vue 2.x!";

            setTimeout(MyGreeting, 5 * 1000);

            setTimeout(function () {
                app.message = "Hello World From Vue 2.x! Again after MyGreeting."
            }, 10 * 1000);
        });

        var app2 = new Vue({
            el: '#app-2',
            data: {
                message: 'You loaded this page on ' + app.message + ' ' + new Date().toLocaleString()
            }
        })
            }
        })
    </script>
</body>
</html>
